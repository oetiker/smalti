# The font must build from a clean checkout, on a machine that has never
# seen this project.  Everything here is `make` -- the Makefile is the build,
# this file only supplies a machine to run it on.
name: build

on:
  # Only main and pull requests: a branch push is already covered by
  # validate.yml, which builds every face in order to check it, and running
  # both on every push would double every run of a same-repo pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No apt step, and that is deliberate.  fonttosfnt (xfonts-utils) built
      # the bitmap .otb and had no pip equivalent; the .otb is gone and this
      # job now installs nothing outside pip.  If an apt-get comes back here,
      # ask what reintroduced it.
      #
      # Project-local .venv holding fontTools, for the outline build.
      - name: python dependencies
        run: make venv

      # `make` builds the .bdf strikes and traces the .ttf; `make woff2`
      # compresses each .ttf for the web.  Both, because both are shipped.
      - name: build
        run: |
          make
          make woff2

      # The outline faces are what fontconfig, every browser and every editor
      # actually get, so the artefact this job uploads must be the one that
      # was proved correct -- every glyph's filled area against its lit pixel
      # count, then the rendered raster against the bitmap at 1x, 2x and 3x.
      - name: the traced outlines match the bitmaps
        run: make check-outlines

      # A STEP THAT CHECKED NOTHING MUST NOT REPORT SUCCESS.
      #
      # This step verifies no fonts itself -- it audits whether the steps
      # above did.  So it counts, and the count has to be non-zero.  An empty
      # glob under nullglob is exactly the trap: no files, no check, green
      # tick.  It has caught that here once already.
      - name: every built font was verified by some step
        run: |
          set -o pipefail
          shopt -s nullglob
          fonts=(build/*.ttf build/*.woff2)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "::error::the build produced no font files in build/"
            exit 1
          fi
          printf 'built: %s\n' "${fonts[@]}"

          # Proved by `make check-outlines` in the step above, and by the
          # render contract in `make check-sources` on the validate workflow.
          # If either is ever removed, remove this too -- counting a file as
          # verified when nothing verified it is the failure this tally exists
          # to stop.
          ttf=(build/*.ttf)
          if [ ${#ttf[@]} -ne 4 ]; then
            echo "::error::${#ttf[@]} .ttf faces built, expected 4"
            exit 1
          fi
          checked=${#ttf[@]}

          echo "verified $checked of ${#fonts[@]} built font files"

          # Not fatal: a format no step can verify yet is a gap to close, not
          # a broken build.  It is named here so it cannot go unnoticed.
          # TODAY THAT IS THE .woff2 -- nothing proves one decompresses to the
          # same outlines as the .ttf it came from.
          if [ "$checked" -ne "${#fonts[@]}" ]; then
            echo "::warning::$(( ${#fonts[@]} - checked )) built font files went" \
                 "unverified -- no check exists here for their format"
          fi

      # Not a formality: install is the documented entry point in the README,
      # and it is the step that would break if a face were renamed.
      - name: install
        run: |
          make install
          ls -l "$HOME/.local/share/fonts/smalti"

      - uses: actions/upload-artifact@v4
        with:
          name: smalti-fonts
          path: |
            build/*.ttf
            build/*.woff2
          if-no-files-found: error
          retention-days: 14
