# The font must build from a clean checkout, on a machine that has never
# seen this project.  Everything here is `make` -- the Makefile is the build,
# this file only supplies a machine to run it on.
name: build

on:
  # Only main and pull requests: a branch push is already covered by
  # validate.yml, which builds every face in order to check it, and running
  # both on every push would double every run of a same-repo pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # No apt step, and that is deliberate.  fonttosfnt (xfonts-utils) built
      # the bitmap .otb and had no pip equivalent; the .otb is gone and this
      # job now installs nothing outside pip.  If an apt-get comes back here,
      # ask what reintroduced it.
      #
      # Project-local .venv holding fontTools, for the outline build.
      - name: python dependencies
        run: make venv

      # `make` builds the .bdf strikes and traces the .ttf; `make woff2`
      # compresses each .ttf for the web.  Both, because both are shipped.
      - name: build
        run: |
          make
          make woff2

      # The outline faces are what fontconfig, every browser and every editor
      # actually get, so the artefact this job uploads must be the one that
      # was proved correct -- every glyph's filled area against its lit pixel
      # count, then the rendered raster against the bitmap at 1x, 2x and 3x.
      - name: the traced outlines match the bitmaps
        run: make check-outlines

      # A STEP THAT CHECKED NOTHING MUST NOT REPORT SUCCESS.
      #
      # This step verifies no fonts itself -- it audits whether the steps
      # above did.  So it counts, and the count has to be non-zero.  An empty
      # glob under nullglob is exactly the trap: no files, no check, green
      # tick.  It has caught that here once already.
      - name: every built font was verified by some step
        run: |
          set -o pipefail
          shopt -s nullglob
          fonts=(build/*.ttf build/*.woff2)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "::error::the build produced no font files in build/"
            exit 1
          fi
          printf 'built: %s\n' "${fonts[@]}"

          # Proved by `make check-outlines` in the step above, and by the
          # render contract in `make check-sources` on the validate workflow.
          # If either is ever removed, remove this too -- counting a file as
          # verified when nothing verified it is the failure this tally exists
          # to stop.
          #
          # FOUR FACES PER SIZE, and the size list is asked of make rather
          # than written here -- the same rule the install step below follows
          # for DEST.  This assertion said a flat "4" and went red on a
          # correct build the day 8x16 landed.
          sizes=$(make -s print-sizes)
          want=$(( 4 * $(echo "$sizes" | wc -w) ))
          ttf=(build/*.ttf)
          if [ ${#ttf[@]} -ne "$want" ]; then
            echo "::error::${#ttf[@]} .ttf faces built, expected $want" \
                 "-- four faces for each of: $sizes"
            exit 1
          fi
          checked=${#ttf[@]}

          echo "verified $checked of ${#fonts[@]} built font files"

          # Not fatal: a format no step can verify yet is a gap to close, not
          # a broken build.  It is named here so it cannot go unnoticed.
          # TODAY THAT IS THE .woff2 -- nothing proves one decompresses to the
          # same outlines as the .ttf it came from.
          if [ "$checked" -ne "${#fonts[@]}" ]; then
            echo "::warning::$(( ${#fonts[@]} - checked )) built font files went" \
                 "unverified -- no check exists here for their format"
          fi

      # Not a formality: install is the documented entry point in the README,
      # and it is the step that would break if a face were renamed.
      #
      # The destination is asked of make, not written here.  A hardcoded copy
      # of it is a second thing to forget when it moves -- which is exactly
      # how this step broke when the install directory changed.  And it counts
      # what arrived: an `ls` alone would pass on an empty directory.
      - name: install
        run: |
          set -euo pipefail
          make install
          dest=$(make -s print-dest)
          ls -l "$dest"
          sizes=$(make -s print-sizes)
          want=$(( 4 * $(echo "$sizes" | wc -w) ))
          n=$(find "$dest" -maxdepth 1 -name '*.ttf' | wc -l)
          if [ "$n" -ne "$want" ]; then
            echo "::error::install put $n .ttf files in $dest, expected $want" \
                 "-- four faces for each of: $sizes"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: smalti-fonts
          path: |
            build/*.ttf
            build/*.woff2
          if-no-files-found: error
          retention-days: 14

  # The OS packages.  This is the ONE place in the repository that installs an
  # apt package, and it buys an honest check rather than a decorative one: the
  # only trustworthy test of an .rpm is `rpm -qp` on the real file, and our own
  # reader checking our own writer would prove nothing.
  #
  # It is a separate job, not a step in `build`, so that the font build's green
  # state keeps meaning "the fonts are fine" with no packaging tooling involved.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # rpm brings rpm2cpio; cpio is separate and the checker needs both to
      # unpack the .rpm.  dpkg-deb is already on the runner.  gettext-base
      # supplies envsubst, which make packages uses to expand the package config.
      - name: packaging tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio gettext-base

      - name: python dependencies
        run: make venv

      - name: build the fonts and the packages
        run: |
          set -euo pipefail
          make
          make packages

      - name: prove what is inside them
        run: make check-packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error
          retention-days: 14
