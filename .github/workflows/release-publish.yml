name: Publish release (automatic)

# Tags and publishes the release once its pull request merges (D28).  The
# fonts and the packages were built and checked by release-build.yml before
# the pull request existed, and are already on the draft release; finalize
# checks that every file in release_assets is there before it publishes.
#
# There is deliberately no workflow_dispatch. Publishing should be a
# consequence of merging a release pull request, never something started from
# a dropdown. A failed run is re-run from the Actions UI: the version comes
# from CHANGES.md, so the re-run does what the first attempt would have.
on:
  push:
    branches: [main]
    paths:
      - CHANGES.md

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/ri-publish-tag.yml
    permissions:
      contents: write
      pull-requests: read

  # The .deb and .rpm to the oposs package registry on gitea.oetiker.ch,
  # which signs them with its own key. The release stays a draft until the
  # upload worked, because finalize needs this job.
  gitea:
    needs: [publish]
    if: needs.publish.outputs.release_id != ''
    uses: ./.github/workflows/ri-publish-gitea.yml
    permissions:
      contents: write
    with:
      release_id: ${{ needs.publish.outputs.release_id }}
      head: ${{ needs.publish.outputs.head }}
    secrets: inherit

  # finalize needs every other job of this file; check verifies it (D30).
  finalize:
    needs: [publish, gitea]
    if: needs.publish.outputs.release_id != ''
    uses: ./.github/workflows/ri-publish-finalize.yml
    permissions:
      contents: write
      actions: write
    with:
      release_id: ${{ needs.publish.outputs.release_id }}
      tag: ${{ needs.publish.outputs.tag }}
      head: ${{ needs.publish.outputs.head }}
