# Push a tag, get a release with the fonts attached.
#
#     git tag -a v1.0.0 -m 'Smalti 1.0.0' && git push origin v1.0.0
#
# The fonts are not rebuilt here.  The build job below is the same reusable
# workflow every push runs, so what a release ships is byte-for-byte what CI
# already built and checked.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload assets to it.
      contents: write
    steps:
      # The zip carries the licence and the install instructions, so the
      # checkout is not redundant.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smalti-fonts
          path: dist

      - name: assemble the release assets
        run: |
          set -o pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          fonts=(dist/*.otb dist/*.ttf dist/*.woff2)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "::error::the build artifact contained no font files"
            exit 1
          fi
          printf 'attaching: %s\n' "${fonts[@]}"

          # One zip for people who just want to unpack a font directory,
          # alongside the individual files for scripted installs.
          stage="smalti-$version"
          mkdir -p "$stage"
          cp "${fonts[@]}" README.md LICENSE.tamzen "$stage/"
          zip -r -q "dist/smalti-$version.zip" "$stage"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          assets=(dist/*.otb dist/*.ttf dist/*.woff2 dist/*.zip)
          # A tag such as v1.0.0-rc1 is a pre-release; v1.0.0 is not.
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # Re-running a release must not fail; it replaces the assets.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Smalti ${tag#v}" \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi
